name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and the latest queued. However, do NOT cancel in-progress runs
# as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job — this static site has no build step, so we validate the
  # embedded docs are current and upload the repo root as the site.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Validate embedded docs are up to date
        run: |
          node scripts/build-embedded-docs.js > /tmp/embedded-docs.js
          diff /tmp/embedded-docs.js embedded-docs.js \
            && echo "embedded-docs.js is current" \
            || { echo "embedded-docs.js is out of date — run: node scripts/build-embedded-docs.js > embedded-docs.js"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload the entire repository root as the deployed site
          path: '.'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
