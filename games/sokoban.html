<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokoban</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a12; color: #e0e0e0;
    min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
  }
  .container { max-width: 520px; width: 100%; text-align: center; }
  h1 {
    font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    background: linear-gradient(90deg, #66ff88, #4488ff, #aa66ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2px;
  }
  .subtitle { font-size: 0.7rem; color: #555; margin-bottom: 8px; letter-spacing: 1px; }
  .game-wrapper { background: #0d0d1a; border-radius: 12px; padding: 8px; margin-bottom: 8px; position: relative; }
  .grid { display: grid; gap: 1px; margin: 0 auto; width: fit-content; }
  .cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; border-radius: 3px; }
  .cell.wall { background: #2a2a3e; }
  .cell.floor { background: #0d0d1a; }
  .cell.goal { background: #0d1a0d; border: 2px solid #66ff88; }
  .cell.box { background: #2a1a00; border-radius: 4px; }
  .cell.box-on-goal { background: #3a2a00; border-radius: 4px; border: 2px solid #ffcc00; box-shadow: 0 0 8px rgba(255,204,0,0.3); }
  .cell.player { border-radius: 50%; }
  .cell.player-on-goal { border-radius: 50%; border: 2px solid #66ff88; }
  .hud { display: flex; justify-content: space-between; padding: 4px 4px 0; font-size: 0.8rem; }
  .hud-label { color: #555; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; }
  .hud-value { font-size: 1rem; font-weight: 700; }
  .hud-moves .hud-value { color: #ffcc00; }
  .hud-level .hud-value { color: #4488ff; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0; }
  .btn {
    padding: 6px 14px; border: none; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.5px; transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn:active { transform: scale(0.95); }
  .btn-reset { background: #ff8800; color: #0a0a12; }
  .btn-reset:hover { box-shadow: 0 0 16px rgba(255,136,0,0.4); }
  .btn-undo { background: #6600ff; color: #fff; }
  .btn-undo:hover { box-shadow: 0 0 16px rgba(102,0,255,0.4); }
  .btn-prev { background: #444; color: #eee; }
  .btn-next { background: #66ff88; color: #0a0a12; }
  .overlay {
    position: absolute; inset: 8px; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(10,10,18,0.88);
    opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 10;
  }
  .overlay.active { opacity: 1; pointer-events: all; }
  .overlay h2 { font-size: 2rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
  .overlay .win-title { background: linear-gradient(90deg, #ffcc00, #66ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .key-hint { font-size: 0.55rem; color: #444; margin-top: 4px; }
  .key-hint kbd { background: #14142a; padding: 1px 5px; border-radius: 3px; border: 1px solid #333; font-family: inherit; color: #777; }
  @media (max-width: 500px) { .cell { width: 32px; height: 32px; font-size: 1rem; } }
</style>
</head>
<body>
<div class="container">
  <h1>🧩 Sokoban</h1>
  <p class="subtitle">Push every box to a goal</p>
  <div class="game-wrapper">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="winOverlay">
      <h2 class="win-title">🎉 Level Clear!</h2>
      <button class="btn btn-next" id="nextBtn">▶ Next Level</button>
    </div>
  </div>
  <div class="hud">
    <div class="hud-level"><div class="hud-label">Level</div><div class="hud-value" id="levelDisplay">1/5</div></div>
    <div class="hud-moves"><div class="hud-label">Moves</div><div class="hud-value" id="movesDisplay">0</div></div>
  </div>
  <div class="controls">
    <button class="btn btn-undo" id="undoBtn">↩ Undo</button>
    <button class="btn btn-reset" id="resetBtn">🔄 Reset</button>
    <button class="btn btn-prev" id="prevBtn">◀ Prev</button>
    <button class="btn btn-next" id="nextBtn2">Next ▶</button>
  </div>
  <div class="key-hint"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move · <kbd>Z</kbd> undo · <kbd>R</kbd> reset</div>
</div>
<script>
const LEVELS = [
  // Level 1 — Simple
  ["#####",
   "#   #",
   "# $ #",
   "# . #",
   "# @ #",
   "#####"],
  // Level 2 — Two boxes
  ["######",
   "#    #",
   "# #$ #",
   "# @  #",
   "# .$ #",
   "#  . #",
   "######"],
  // Level 3 — Corner challenge
   [" #####",
    "##  ##",
    "# $  #",
    "# @# #",
    "# $ .#",
    "#  . #",
    "######"],
  // Level 4 — Three boxes
  [" ########",
   "##     $#",
   "#  $ .  #",
   "#  .#   #",
   "#  @. $ #",
   "##     $#",
   " ########",
   "  #######"],
  // Level 5 — Advanced
  ["  ######",
   "###    #",
   "# $ #  #",
   "#  $   #",
   "# .# $ #",
   "# .  @ #",
   "#   #  #",
   "########"],
];
for (let i = 0; i < LEVELS.length; i++) LEVELS[i] = LEVELS[i].map(r => r.split(''));

const gridEl = document.getElementById('grid');
const movesDisplay = document.getElementById('movesDisplay');
const levelDisplay = document.getElementById('levelDisplay');
const undoBtn = document.getElementById('undoBtn');
const resetBtn = document.getElementById('resetBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn2');
const winOverlay = document.getElementById('winOverlay');
const nextBtnWin = document.getElementById('nextBtn');

let currentLevel = 0, board = [], player = {r:0,c:0}, goals = [];
let moves = 0, history = [];
let CELL_TYPES = {'#':'wall',' ':'floor','$':'floor','.':'goal','@':'floor','+':'goal','*':'goal'};

function loadLevel(idx) {
  if (idx < 0) idx = 0;
  if (idx >= LEVELS.length) idx = LEVELS.length - 1;
  currentLevel = idx; moves = 0; history = [];
  const raw = LEVELS[idx];
  // Pad all rows to the same length so the CSS grid doesn't break
  const maxW = Math.max(...raw.map(r => r.length));
  board = raw.map(r => {
    const row = [...r];
    while (row.length < maxW) row.push(' ');
    return row;
  });
  goals = []; player = {r:0,c:0};
  for (let r = 0; r < board.length; r++)
    for (let c = 0; c < board[r].length; c++) {
      const ch = board[r][c];
      if (ch === '.' || ch === '+' || ch === '*') goals.push({r,c});
      if (ch === '@' || ch === '+') { player.r = r; player.c = c; }
      // Normalize box-on-goal and player-on-goal to simple chars
      if (ch === '+') board[r][c] = '@';
      if (ch === '*') board[r][c] = '$';
    }
  movesDisplay.textContent = '0';
  levelDisplay.textContent = `${idx+1}/${LEVELS.length}`;
  winOverlay.classList.remove('active');
  render();
}

function render() {
  gridEl.style.gridTemplateColumns = `repeat(${board[0].length}, 40px)`;
  gridEl.innerHTML = '';
  // Normalize board for rendering
  for (let r = 0; r < board.length; r++) {
    for (let c = 0; c < board[r].length; c++) {
      const div = document.createElement('div');
      div.className = 'cell';
      const ch = board[r][c];
      const isGoal = goals.some(g => g.r === r && g.c === c);
      const isPlayer = (r === player.r && c === player.c);
      if (ch === '#') { div.classList.add('wall'); div.textContent = '⬛'; }
      else if (isPlayer && isGoal) { div.classList.add('player-on-goal'); div.style.background = '#4488ff'; div.textContent = '🧑'; }
      else if (isPlayer) { div.classList.add('player'); div.style.background = '#4488ff'; div.textContent = '🧑'; }
      else if (ch === '$' && isGoal) { div.classList.add('box-on-goal'); div.textContent = '📦'; }
      else if (ch === '$') { div.classList.add('box'); div.textContent = '📦'; }
      else if (isGoal) { div.classList.add('goal'); }
      else { div.classList.add('floor'); }
      gridEl.appendChild(div);
    }
  }
}

function move(dr, dc) {
  const nr = player.r + dr, nc = player.c + dc;
  if (nr < 0 || nr >= board.length || nc < 0 || nc >= board[0].length) return;
  const target = board[nr][nc];
  if (target === '#') return;
  if (target === '$') {
    const br = nr + dr, bc = nc + dc;
    if (br < 0 || br >= board.length || bc < 0 || bc >= board[0].length) return;
    if (board[br][bc] === '#' || board[br][bc] === '$') return;
    // Push box
    history.push({r:player.r,c:player.c,br:nr,bc:nc,obr:br,obc:bc,och:board[br][bc],och2:board[nr][nc]});
    board[nr][nc] = ' ';
    board[br][bc] = '$';
    player.r = nr; player.c = nc;
    moves++; movesDisplay.textContent = moves;
    checkWin();
    render();
  } else {
    history.push({r:player.r,c:player.c,br:-1,bc:-1});
    player.r = nr; player.c = nc;
    moves++; movesDisplay.textContent = moves;
    render();
  }
}

function undo() {
  if (history.length === 0) return;
  const h = history.pop();
  player.r = h.r; player.c = h.c;
  if (h.br >= 0) {
    board[h.br][h.bc] = h.och;
    board[h.obr][h.obc] = h.och2;
  }
  moves--; movesDisplay.textContent = moves;
  winOverlay.classList.remove('active');
  render();
}

function checkWin() {
  for (const g of goals) if (board[g.r][g.c] !== '$') return;
  winOverlay.classList.add('active');
}

document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (key === 'ArrowUp' || key === 'w' || key === 'W') { e.preventDefault(); move(-1,0); }
  else if (key === 'ArrowDown' || key === 's' || key === 'S') { e.preventDefault(); move(1,0); }
  else if (key === 'ArrowLeft' || key === 'a' || key === 'A') { e.preventDefault(); move(0,-1); }
  else if (key === 'ArrowRight' || key === 'd' || key === 'D') { e.preventDefault(); move(0,1); }
  else if (key === 'z' || key === 'Z') { e.preventDefault(); undo(); }
  else if (key === 'r' || key === 'R') { e.preventDefault(); loadLevel(currentLevel); }
});

undoBtn.addEventListener('click', undo);
resetBtn.addEventListener('click', () => loadLevel(currentLevel));
prevBtn.addEventListener('click', () => loadLevel(currentLevel - 1));
nextBtn.addEventListener('click', () => loadLevel(currentLevel + 1));
nextBtn2.addEventListener('click', () => loadLevel(currentLevel + 1));
nextBtnWin.addEventListener('click', () => loadLevel(currentLevel + 1));

loadLevel(0);
</script>
</body>
</html>
