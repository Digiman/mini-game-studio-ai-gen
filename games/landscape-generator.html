<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Landscape Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    max-width: 700px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 4px;
    color: #f0f0f0;
    letter-spacing: 0.5px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #8888aa;
    margin-bottom: 16px;
  }

  .canvas-wrapper {
    position: relative;
    background: #0f0f1a;
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    margin-bottom: 16px;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    image-rendering: pixelated;
    border-radius: 8px;
    cursor: crosshair;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
  }

  .controls label {
    font-size: 0.8rem;
    color: #aaa;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  input[type="number"] {
    width: 90px;
    padding: 6px 10px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #16213e;
    color: #e0e0e0;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="number"]:focus {
    border-color: #4fc3f7;
  }

  input[type="range"] {
    width: 80px;
    accent-color: #4fc3f7;
    vertical-align: middle;
  }

  .btn {
    padding: 7px 16px;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    background: #0f3460;
    color: #e0e0e0;
  }
  .btn:hover { background: #1a4a7a; }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: #4fc3f7;
    color: #0f0f1a;
  }
  .btn-primary:hover { background: #6dd5fa; }
  .btn-success {
    background: #66bb6a;
    color: #0f0f1a;
  }
  .btn-success:hover { background: #81c784; }
  .btn-outline {
    background: transparent;
    border: 1px solid #444;
  }
  .btn-outline:hover { background: #222; }

  .palette-section {
    background: #16213e;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }

  .palette-section h3 {
    font-size: 0.8rem;
    color: #8888aa;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .palette-grid {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .palette-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .palette-swatch {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s;
  }
  .palette-swatch:hover { border-color: #fff; }

  .palette-label {
    font-size: 0.6rem;
    color: #888;
    white-space: nowrap;
  }

  input[type="color"] {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    top: 0;
    left: 0;
  }

  .seed-display {
    font-size: 0.75rem;
    color: #666;
    margin-top: 6px;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #333;
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 500px) {
    .controls { gap: 8px; }
    .btn { font-size: 0.8rem; padding: 6px 12px; }
    .palette-swatch { width: 28px; height: 28px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🏔️ Landscape Generator</h1>
  <p class="subtitle">Procedural pixel-art terrain · shareable seeds</p>

  <div class="canvas-wrapper">
    <canvas id="canvas" width="512" height="512"></canvas>
  </div>

  <div class="controls">
    <label>
      Seed
      <input type="number" id="seedInput" value="0" min="0" max="99999999">
    </label>
    <button class="btn btn-primary" id="regenerateBtn">🌱 Generate</button>
    <button class="btn btn-outline" id="randomizeBtn">🎲 Random</button>
    <button class="btn btn-outline" id="copyLinkBtn">🔗 Copy Link</button>
    <button class="btn btn-success" id="exportBtn">⬇ PNG</button>
  </div>

  <div class="controls" style="margin-bottom: 12px;">
    <label>
      Octaves
      <input type="range" id="octavesSlider" min="1" max="8" value="6">
      <span id="octavesValue">6</span>
    </label>
    <label>
      Pixel Size
      <input type="range" id="pixelSizeSlider" min="1" max="8" value="4">
      <span id="pixelSizeValue">4</span>
    </label>
  </div>

  <div class="palette-section">
    <h3>🎨 Color Palette</h3>
    <div class="palette-grid" id="paletteGrid"></div>
  </div>

  <div class="seed-display" id="seedDisplay">Ready</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Seeded PRNG: Mulberry32 ────────────────────────────────────────────────
function mulberry32(seed) {
  let s = seed | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ─── Value Noise ────────────────────────────────────────────────────────────
function valueNoise2D(rng, width, height) {
  // Generate random grid values
  const grid = [];
  for (let y = 0; y < height + 1; y++) {
    grid[y] = [];
    for (let x = 0; x < width + 1; x++) {
      grid[y][x] = rng();
    }
  }
  return grid;
}

function smoothstep(t) {
  return t * t * (3 - 2 * t);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function sampleNoise(grid, x, y, width, height) {
  const x0 = Math.floor(x);
  const x1 = x0 + 1;
  const y0 = Math.floor(y);
  const y1 = y0 + 1;

  const fx = smoothstep(x - x0);
  const fy = smoothstep(y - y0);

  const top = lerp(grid[y0][x0], grid[y0][x1], fx);
  const bottom = lerp(grid[y1][x0], grid[y1][x1], fx);
  return lerp(top, bottom, fy);
}

// ─── Fractal Brownian Motion ───────────────────────────────────────────────
function fbm(noiseGrid, nx, ny, octaves, width, height) {
  let value = 0;
  let amplitude = 1;
  let frequency = 1;
  let maxValue = 0;

  for (let i = 0; i < octaves; i++) {
    const x = nx * frequency;
    const y = ny * frequency;
    // Wrap coordinates within the noise grid
    const wx = x % width;
    const wy = y % height;
    // Handle negative wrapping
    const sx = wx < 0 ? wx + width : wx;
    const sy = wy < 0 ? wy + height : wy;

    value += amplitude * sampleNoise(noiseGrid, sx, sy, width, height);
    maxValue += amplitude;
    amplitude *= 0.5;
    frequency *= 2;
  }

  return value / maxValue; // Normalize to 0..1
}

// ─── Terrain Generator ──────────────────────────────────────────────────────
function generateHeightmap(seed, octaves, pixelSize, canvasSize) {
  const logicalSize = canvasSize / pixelSize;
  const rng = mulberry32(seed);
  const noiseGrid = valueNoise2D(rng, logicalSize, logicalSize);

  const heightmap = [];
  for (let y = 0; y < logicalSize; y++) {
    heightmap[y] = [];
    for (let x = 0; x < logicalSize; x++) {
      const nx = x / logicalSize;
      const ny = y / logicalSize;
      heightmap[y][x] = fbm(noiseGrid, nx * logicalSize, ny * logicalSize, octaves, logicalSize, logicalSize);
    }
  }
  return heightmap;
}

// ─── Default Palette ────────────────────────────────────────────────────────
const DEFAULT_PALETTE = [
  { label: 'Deep Water',   color: '#0d1b3e', threshold: 0.40 },
  { label: 'Shallow Water',color: '#1a4a8a', threshold: 0.45 },
  { label: 'Sand',         color: '#d4b87a', threshold: 0.50 },
  { label: 'Grass',        color: '#4a8c3f', threshold: 0.70 },
  { label: 'Forest',       color: '#2d5a1e', threshold: 0.85 },
  { label: 'Mountain',     color: '#7a7a8a', threshold: 0.93 },
  { label: 'Snow',         color: '#e8e8f0', threshold: 1.01 },
];

// ─── State ──────────────────────────────────────────────────────────────────
let currentSeed = 0;
let currentPalette = DEFAULT_PALETTE.map(p => ({ ...p }));
let isDirty = true;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CANVAS_SIZE = 512;

// ─── Rendering ──────────────────────────────────────────────────────────────
function getColor(height, palette) {
  for (const band of palette) {
    if (height < band.threshold) {
      return band.color;
    }
  }
  return palette[palette.length - 1].color;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function render(imageData, heightmap, palette, pixelSize, canvasSize) {
  const logicalSize = canvasSize / pixelSize;

  for (let py = 0; py < logicalSize; py++) {
    for (let px = 0; px < logicalSize; px++) {
      const height = heightmap[py][px];
      const color = getColor(height, palette);
      const rgb = hexToRgb(color);

      // Fill the pixel block
      for (let dy = 0; dy < pixelSize; dy++) {
        for (let dx = 0; dx < pixelSize; dx++) {
          const cx = px * pixelSize + dx;
          const cy = py * pixelSize + dy;
          const idx = (cy * canvasSize + cx) * 4;
          imageData.data[idx]     = rgb.r;
          imageData.data[idx + 1] = rgb.g;
          imageData.data[idx + 2] = rgb.b;
          imageData.data[idx + 3] = 255;
        }
      }
    }
  }
}

function generate(seed, octaves, pixelSize, palette) {
  const heightmap = generateHeightmap(seed, octaves, pixelSize, CANVAS_SIZE);
  const imageData = ctx.createImageData(CANVAS_SIZE, CANVAS_SIZE);
  render(imageData, heightmap, palette, pixelSize, CANVAS_SIZE);
  ctx.putImageData(imageData, 0, 0);
  return heightmap;
}

// ─── UI Setup ───────────────────────────────────────────────────────────────
const seedInput = document.getElementById('seedInput');
const regenerateBtn = document.getElementById('regenerateBtn');
const randomizeBtn = document.getElementById('randomizeBtn');
const copyLinkBtn = document.getElementById('copyLinkBtn');
const exportBtn = document.getElementById('exportBtn');
const octavesSlider = document.getElementById('octavesSlider');
const octavesValue = document.getElementById('octavesValue');
const pixelSizeSlider = document.getElementById('pixelSizeSlider');
const pixelSizeValue = document.getElementById('pixelSizeValue');
const paletteGrid = document.getElementById('paletteGrid');
const seedDisplay = document.getElementById('seedDisplay');
const toast = document.getElementById('toast');

let toastTimeout = null;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('visible');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('visible'), 2500);
}

function buildPaletteUI() {
  paletteGrid.innerHTML = '';
  currentPalette.forEach((band, i) => {
    const item = document.createElement('div');
    item.className = 'palette-item';

    const swatch = document.createElement('div');
    swatch.className = 'palette-swatch';
    swatch.style.background = band.color;

    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = band.color;
    colorInput.addEventListener('input', (e) => {
      currentPalette[i].color = e.target.value;
      swatch.style.background = e.target.value;
      regenerate();
    });

    swatch.appendChild(colorInput);

    const label = document.createElement('span');
    label.className = 'palette-label';
    label.textContent = band.label;

    item.appendChild(swatch);
    item.appendChild(label);
    paletteGrid.appendChild(item);
  });
}

function getSettings() {
  return {
    seed: parseInt(seedInput.value, 10) || 0,
    octaves: parseInt(octavesSlider.value, 10),
    pixelSize: parseInt(pixelSizeSlider.value, 10),
  };
}

function regenerate() {
  const { seed, octaves, pixelSize } = getSettings();
  currentSeed = seed;
  generate(seed, octaves, pixelSize, currentPalette);
  window.location.hash = `seed=${seed}&octaves=${octaves}&pixel=${pixelSize}`;
  seedDisplay.textContent = `Seed: ${seed} · Octaves: ${octaves} · Pixel: ${pixelSize}×${pixelSize}`;
  isDirty = false;
}

function randomSeed() {
  const newSeed = (Math.random() * 99999999) | 0;
  seedInput.value = newSeed;
  regenerate();
}

function copyLink() {
  const { seed, octaves, pixelSize } = getSettings();
  const url = `${window.location.origin}${window.location.pathname}#seed=${seed}&octaves=${octaves}&pixel=${pixelSize}`;
  navigator.clipboard.writeText(url).then(
    () => showToast('🔗 Link copied to clipboard!'),
    () => showToast('Failed to copy link')
  );
}

function exportPNG() {
  const link = document.createElement('a');
  link.download = `landscape-${currentSeed}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('⬇ PNG saved!');
}

function parseHash() {
  const hash = window.location.hash.slice(1);
  if (!hash) return false;
  const params = new URLSearchParams(hash);
  const seed = params.get('seed');
  const octaves = params.get('octaves');
  const pixel = params.get('pixel');
  if (seed !== null) seedInput.value = seed;
  if (octaves !== null) { octavesSlider.value = octaves; octavesValue.textContent = octaves; }
  if (pixel !== null) { pixelSizeSlider.value = pixel; pixelSizeValue.textContent = pixel; }
  return seed !== null;
}

// ─── Event Listeners ────────────────────────────────────────────────────────
regenerateBtn.addEventListener('click', regenerate);
randomizeBtn.addEventListener('click', randomSeed);
copyLinkBtn.addEventListener('click', copyLink);
exportBtn.addEventListener('click', exportPNG);

octavesSlider.addEventListener('input', () => {
  octavesValue.textContent = octavesSlider.value;
});
octavesSlider.addEventListener('change', regenerate);

pixelSizeSlider.addEventListener('input', () => {
  pixelSizeValue.textContent = pixelSizeSlider.value;
});
pixelSizeSlider.addEventListener('change', regenerate);

seedInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') regenerate();
});

// ─── Init ───────────────────────────────────────────────────────────────────
buildPaletteUI();

// Check URL hash on load
if (!parseHash()) {
  // No hash, generate a random landscape
  randomSeed();
} else {
  regenerate();
}
</script>
</body>
</html>
